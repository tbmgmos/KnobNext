name: Probe versions

on: push

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          M=https://dl.google.com/dl/android/maven2
          echo "== AGP 8.x / 9.x"
          curl -sSL $M/com/android/tools/build/gradle/maven-metadata.xml | grep -oE '<version>(8\.1[0-9]|9\.[0-9])\.[0-9]+</version>' | sed -E 's#</?version>##g' | tr '\n' ' '; echo
          echo "== BOM 2026.09.00 material3/ui/foundation"
          curl -sSL $M/androidx/compose/compose-bom/2026.09.00/compose-bom-2026.09.00.pom | grep -A1 -E '<artifactId>(material3|ui|foundation)</artifactId>' | grep -oE '<version>[^<]+'
          echo "== material3 1.5.0-beta01 module"
          curl -sSL $M/androidx/compose/material3/material3-android/1.5.0-beta01/material3-android-1.5.0-beta01.module | grep -E '"(group|module|version|requires)"|kotlin' | head -60
          echo "== aar-metadata"
          cd $RUNNER_TEMP && curl -sSL -o m3.aar $M/androidx/compose/material3/material3-android/1.5.0-beta01/material3-android-1.5.0-beta01.aar && unzip -p m3.aar META-INF/com/android/build/gradle/aar-metadata.properties
          curl -sSL -o ui.aar $M/androidx/compose/ui/ui-android/$(curl -sSL $M/androidx/compose/compose-bom/2026.09.00/compose-bom-2026.09.00.pom | grep -A1 '<artifactId>ui</artifactId>' | grep -oE '[0-9][^<]+' )/ui-android-$(curl -sSL $M/androidx/compose/compose-bom/2026.09.00/compose-bom-2026.09.00.pom | grep -A1 '<artifactId>ui</artifactId>' | grep -oE '[0-9][^<]+' ).aar && unzip -p ui.aar META-INF/com/android/build/gradle/aar-metadata.properties
          unzip -l m3.aar | head; unzip -o -q m3.aar classes.jar && unzip -p classes.jar META-INF/*.kotlin_module | head -c 50 | xxd | head -3
          unzip -l classes.jar | grep -E 'MaterialExpressiveTheme|MaterialShapes|ButtonGroupKt|LargeFlexibleTopAppBar|AppBarKt|SwitchKt|ToggleButtonKt|ListItemKt|SegmentedListItem|LoadingIndicatorKt' | awk '{print $4}'
