name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a release with this version (e.g. 3.0.1); creates the v-tag. Empty = just build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    # A PR from this repository's own branch is already built by its push; build only PRs from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE: ${{ inputs.release }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KNOB_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* || -n "$RELEASE" ]]; then
            # A release signed with a throwaway key could never be updated in place.
            echo "::error::KEYSTORE_BASE64 secret is not set; refusing to publish a release"
            exit 1
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set, APK is signed with a throwaway debug key"
          fi

      - name: Compute version
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          if [[ -n "$RELEASE" ]]; then
            NAME="${RELEASE#v}"
            if [[ ! "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release version must look like 3.0.1, got '$RELEASE'"
              exit 1
            fi
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            BASE="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v3.0.0)"
            NAME="${BASE#v}-dev.$(git rev-parse --short HEAD)"
          fi
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          KNOB_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KNOB_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KNOB_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleGithubRelease assembleRustoreRelease --no-daemon \
            -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"
          mkdir -p dist rustore
          cp app/build/outputs/apk/github/release/app-github-release.apk "dist/KnobNext-$VERSION_NAME.apk"
          cp app/build/outputs/apk/rustore/release/app-rustore-release.apk "rustore/KnobNext-$VERSION_NAME-rustore.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: KnobNext-${{ env.VERSION_NAME }}
          path: dist/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KnobNext-${{ env.VERSION_NAME }}-rustore
          path: rustore/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          # For a manual release this creates the tag on the commit that was built.
          tag_name: v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          files: dist/*.apk
          generate_release_notes: true
